services:
  trips-web:
    #build: ./frontend/
    image: ghcr.io/seanmorley15/adventurelog-frontend:latest
    container_name: adventurelog-frontend
    hostname: adventurelog-frontend
    restart: unless-stopped
    environment:
      - PUBLIC_SERVER_URL=http://trips-server:8000 # Should be the service name of the backend with port 8000, even if you change the port in the backend service
      #- PUBLIC_SERVER_URL=adventurelog-backend:8000
      - ORIGIN=https://trips.$HOST_NAME
      - BODY_SIZE_LIMIT=Infinity
      - DISABLE_REGISTRATION=True
      - DISABLE_REGISTRATION_MESSAGE='Registration is disabled.'
    #ports:
    #  - "8015:3000"
    depends_on:
      - trips-server
    networks:
      proxy:
        ipv4_address: 172.18.0.85
    dns:
      # pihole container
      # - 172.18.0.46
      - 192.168.1.61
      - 192.168.1.62
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trips.entrypoints=https"
      - "traefik.http.routers.trips.rule=Host(`trips.$MY_DOMAIN`)"
      #- "traefik.http.routers.trips.rule=Host(`trips.knlklabacka.com`) && !(PathPrefix(`/media`) || PathPrefix(`/admin`) || PathPrefix(`/static`) || PathPrefix(`/accounts`))" # Replace with your domain
      - "traefik.http.routers.trips.tls=true"
      - "traefik.http.services.trips.loadbalancer.server.port=3000"
      - "traefik.http.routers.trips.tls.certresolver=myresolver"
      #- "traefik.http.routers.trips.middlewares=tinyauth"

  trips-db:
    image: postgis/postgis:15-3.3
    container_name: adventurelog-db
    hostname: adventurelog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: adventurelog
      POSTGRES_USER: adventure
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      # - trips_postgres_data:/var/lib/postgresql/data/
      - /home/mdk177/documents/nfs-server/trips/db_data:/var/lib/postgres/data/
    networks:
      proxy:
        ipv4_address: 172.18.0.86
    dns:
      # pihole container
      # - 172.18.0.46
      - 192.168.1.61
      - 192.168.1.62

  trips-server:
    #build: ./backend/
    image: ghcr.io/seanmorley15/adventurelog-backend:latest
    container_name: adventurelog-backend
    hostname: adventurelog-backend
    restart: unless-stopped
    environment:
      - PGHOST=$DB_HOST
      - PGDATABASE=$DB_DATABASE
      - PGUSER=$DB_USER
      - PGPASSWORD=$DB_PASSWORD
      - SECRET_KEY=$SECRET_KEY
      - DJANGO_ADMIN_USERNAME=$DJ_ADMIN_USERNAME
      - DJANGO_ADMIN_PASSWORD=$DJ_ADMIN_PASSWORD
      - EMAIL_HOST_PASSWORD=$EMAIL_HOST_PASSWORD
      - DEFAULT_FROM_EMAIL=$MY_EMAIL
      - DJANGO_ADMIN_EMAIL=$MY_EMAIL
      - PUBLIC_URL=https://trips.${HOST_NAME} # Match the outward port, used for the creation of image urls
      #- CSRF_TRUSTED_ORIGINS=http://trips.knlklabacka.com,http://tripslog.knlklabacka.com,https://trips.knlklabacka.com,https://tripslog.knlklabacka.com,http://trips-web,https://trips-web,http://trips-server,https://trips-server # Comma separated list of trusted origins for CSRF
      - CSRF_TRUSTED_ORIGINS=https://trips.${HOST_NAME}
      - DEBUG=True
      - FRONTEND_URL=https://trips.${HOST_NAME} # Used for email generation. This should be the url of the frontend
      - DISABLE_REGISTRATION=false
      - EMAIL_BACKEND=email
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_USE_TLS=False
      - EMAIL_PORT=465
      - EMAIL_USE_SSL=True
      - EMAIL_HOST_USER=$MY_EMAIL
      - DEFAULT_FROM_EMAIL=$MY_EMAIL
   #ports:
    #  - "8016:80"
    depends_on:
      - trips-db
    volumes:
      - /home/mdk177/documents/nfs-server/trips/media:/code/media/
      #- adventurelog_media:/code/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tripslog.entrypoints=https"
      - "traefik.http.routers.tripslog.rule=Host(`trips.$HOST_NAME`) && (PathPrefix(`/media`) || PathPrefix(`/admin`) || PathPrefix(`/static`) || PathPrefix(`/accounts`))"
      - "traefik.http.routers.tripslog.tls=true"
      - "traefik.http.services.tripslog.loadbalancer.server.port=8000"
      - "traefik.http.routers.tripslog.tls.certresolver=myresolver"
    networks:
      proxy:
        ipv4_address: 172.18.0.87
    dns:
      # pihole container
      #- 172.18.0.46
      - 192.168.1.61
      - 192.168.1.62

  #beszel-agent:
  #  image: "henrygd/beszel-agent"
